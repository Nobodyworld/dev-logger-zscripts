name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Type check
        run: |
          mypy \
            zscripts/application \
            zscripts/config.py \
            zscripts/configuration.py \
            zscripts/observability/logging.py \
            zscripts/observability/metrics.py \
            zscripts/observability/health.py \
            zscripts/observability/instrumentation.py \
            zscripts/extensions/scaffolding.py \
            zscripts/schemas
      - name: Security scans
        run: |
          bandit -q -r zscripts examples/sample_project
          pip-audit
          python scripts/no_binaries.py
      - name: Run tests
        run: pytest
      - name: Capture diagnostics snapshot
        run: |
          python scripts/diagnostics_probe.py --include-metrics --output reports/diagnostics_ci.json --fail-on-status degraded
      - name: Upload quality summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-reports
          path: reports/
