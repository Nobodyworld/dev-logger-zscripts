name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,helpers]'
      - name: Verify required CI tools
        run: |
          command -v ruff
          command -v mypy
          command -v bandit
          command -v pip-audit
          command -v coverage
          command -v pytest
          command -v zscripts
      - name: Verify editable package installation
        run: |
          mkdir -p reports
          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            python -c "import zscripts; print(zscripts.__file__)"
            zscripts guardrails > "$GITHUB_WORKSPACE/reports/guardrails_editable.json"
            python -m zscripts guardrails > "$GITHUB_WORKSPACE/reports/guardrails_module.json"
          )
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Type check
        run: |
          mypy \
            zscripts/application \
            zscripts/config.py \
            zscripts/configuration.py \
            zscripts/observability/logging.py \
            zscripts/observability/metrics.py \
            zscripts/observability/health.py \
            zscripts/observability/instrumentation.py \
            zscripts/extensions/scaffolding.py \
            zscripts/schemas
      - name: Bandit
        run: bandit -q -r zscripts examples/sample_project
      - name: Dependency audit
        run: pip-audit
      - name: Binary scan
        run: python scripts/no_binaries.py
      - name: Run tests with coverage
        run: |
          python -m coverage erase
          python -m coverage run -m pytest
          python -m coverage report --fail-under=85
          python -m coverage json -o reports/coverage.json
      - name: Validate documentation links
        run: python scripts/validate_docs_links.py
      - name: Build and smoke wheel
        run: |
          python -m build --wheel --outdir dist
          wheel_venv="$RUNNER_TEMP/zscripts-wheel-smoke"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --upgrade pip
          "$wheel_venv/bin/python" -m pip install dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$wheel_venv/bin/python" -c "import zscripts; print(zscripts.__file__)"
            "$wheel_venv/bin/python" -c "import jsonschema; print(jsonschema.__version__)"
            if "$wheel_venv/bin/python" -c "from datetime import datetime; from zscripts.infrastructure.schema import JsonSchemaValidator; from zscripts.schemas import NormalizedLog; payload = NormalizedLog(tool='pytest', ecosystem='python', command='pytest', status='passed', summary='ok', timestamp=datetime.now(), metadata={'attempt': 1}); JsonSchemaValidator().validate(payload)"; then
              echo "Invalid normalized payload unexpectedly passed schema validation."
              exit 1
            fi
            "$wheel_venv/bin/zscripts" guardrails > "$GITHUB_WORKSPACE/reports/guardrails_wheel.json"
            "$wheel_venv/bin/python" -m zscripts guardrails > "$GITHUB_WORKSPACE/reports/guardrails_wheel_module.json"
          )
      - name: Build and smoke zipapp
        run: |
          python scripts/build_artifact.py
          python artifacts/build/zscripts.pyz guardrails > reports/guardrails_zipapp.json
          python artifacts/build/zscripts.pyz adapters --format json > reports/adapters_zipapp.json
      - name: Capture diagnostics snapshot
        run: |
          python -m scripts.diagnostics_probe --include-metrics --output reports/diagnostics_ci.json --fail-on-status degraded
      - name: Upload quality summary
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: quality-reports
          path: reports/
