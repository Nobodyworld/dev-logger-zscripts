name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,helpers]'
      - name: Verify required CI tools
        run: |
          command -v ruff
          command -v mypy
          command -v bandit
          command -v pip-audit
          command -v coverage
          command -v pytest
          command -v zscripts
      - name: Verify editable package installation
        run: |
          mkdir -p reports
          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            python -c "import zscripts; print(zscripts.__file__)"
            zscripts guardrails > "$GITHUB_WORKSPACE/reports/guardrails_editable.json"
            python -m zscripts guardrails > "$GITHUB_WORKSPACE/reports/guardrails_module.json"
          )
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Type check
        run: |
          mypy \
            zscripts/application \
            zscripts/config.py \
            zscripts/configuration.py \
            zscripts/observability/logging.py \
            zscripts/observability/metrics.py \
            zscripts/observability/health.py \
            zscripts/observability/instrumentation.py \
            zscripts/extensions/scaffolding.py \
            zscripts/schemas
      - name: Security scans
        run: |
          bandit -q -r zscripts examples/sample_project
          pip-audit
          python scripts/no_binaries.py
      - name: Run tests with coverage
        run: |
          python -m coverage erase
          python -m coverage run -m pytest
          python -m coverage report --fail-under=85
          python -m coverage json -o reports/coverage.json
      - name: Validate documentation links
        run: python scripts/validate_docs_links.py
      - name: Build and smoke wheel
        run: |
          python -m build --wheel --outdir dist
          wheel_venv="$RUNNER_TEMP/zscripts-wheel-smoke"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --upgrade pip
          "$wheel_venv/bin/python" -m pip install dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$wheel_venv/bin/python" -c "import zscripts; print(zscripts.__file__)"
            "$wheel_venv/bin/zscripts" guardrails > "$GITHUB_WORKSPACE/reports/guardrails_wheel.json"
            "$wheel_venv/bin/python" -m zscripts guardrails > "$GITHUB_WORKSPACE/reports/guardrails_wheel_module.json"
          )
      - name: Build and smoke zipapp
        run: |
          python scripts/build_artifact.py
          python artifacts/build/zscripts.pyz guardrails > reports/guardrails_zipapp.json
          python artifacts/build/zscripts.pyz adapters --format json > reports/adapters_zipapp.json
      - name: Capture diagnostics snapshot
        run: |
          python -m scripts.diagnostics_probe --include-metrics --output reports/diagnostics_ci.json --fail-on-status degraded
      - name: Upload quality summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: reports/
