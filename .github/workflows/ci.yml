name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@9191ea1a55b1e7028943ee5647bf579e1182b42d # post-v7.0.0 security fixes
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA fix
        with:
          node-version: "24.19.0"
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@10.18.1
          pnpm --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,helpers,workspace]'
      - name: Detect secrets (pre-commit parity)
        run: python -m pre_commit run detect-secrets --all-files
      - name: Lint
        run: |
          python scripts/quality_gate.py format-check
          python scripts/quality_gate.py lint
      - name: Type check
        run: python scripts/quality_gate.py type
      - name: Frontend install contract
        run: python scripts/quality_gate.py frontend-install
      - name: Frontend format and lint
        run: |
          python scripts/quality_gate.py frontend-format
          python scripts/quality_gate.py frontend-lint
      - name: Frontend typecheck
        run: python scripts/quality_gate.py frontend-typecheck
      - name: Frontend unit tests
        run: python scripts/quality_gate.py frontend-tests
      - name: Frontend build
        run: python scripts/quality_gate.py frontend-build
      - name: Repository read-only safety contracts
        run: python scripts/quality_gate.py repository-safety
      - name: Snapshot persistence contracts
        run: python scripts/quality_gate.py snapshot-store
      - name: Workspace API contracts
        run: python scripts/quality_gate.py workspace-api
      - name: Packaged workspace smoke
        run: python scripts/quality_gate.py packaged-workspace
      - name: Legacy helper Phase 2A contracts
        run: |
          python scripts/quality_gate.py helper-surface
          python scripts/quality_gate.py helper-boundary
          python scripts/quality_gate.py helper-compatibility
      - name: Bandit
        run: python scripts/quality_gate.py bandit
      - name: Dependency audit
        run: python scripts/quality_gate.py audit
      - name: Binary scan
        run: python scripts/quality_gate.py binary
      - name: Run tests with coverage
        run: |
          python scripts/quality_gate.py tests
          python scripts/quality_gate.py coverage
      - name: Validate documentation links
        run: python scripts/quality_gate.py docs
      - name: Verify editable package installation
        run: python scripts/quality_gate.py editable-smoke
      - name: Build and smoke wheel
        run: python scripts/quality_gate.py wheel
      - name: Build and smoke zipapp
        run: python scripts/quality_gate.py zipapp
      - name: Capture diagnostics snapshot
        run: python scripts/quality_gate.py diagnostics
      - name: Upload quality summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: reports/
