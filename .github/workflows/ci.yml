name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run quality gate
        run: python scripts/dev_start.py
      - name: Capture diagnostics snapshot
        run: |
          python scripts/diagnostics_probe.py --include-metrics --output reports/diagnostics_ci.json --fail-on-status degraded
      - name: Upload quality summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-reports
          path: reports/
