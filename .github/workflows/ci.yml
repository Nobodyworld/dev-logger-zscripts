name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,helpers]'
      - name: Verify required CI tools
        run: |
          command -v ruff
          command -v mypy
          command -v bandit
          command -v pip-audit
          command -v coverage
          command -v pytest
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Type check
        run: |
          mypy \
            zscripts/application \
            zscripts/config.py \
            zscripts/configuration.py \
            zscripts/observability/logging.py \
            zscripts/observability/metrics.py \
            zscripts/observability/health.py \
            zscripts/observability/instrumentation.py \
            zscripts/extensions/scaffolding.py \
            zscripts/schemas
      - name: Security scans
        run: |
          bandit -q -r zscripts examples/sample_project
          pip-audit
          python scripts/no_binaries.py
      - name: Run tests
        run: pytest
      - name: Capture diagnostics snapshot
        run: |
          python scripts/diagnostics_probe.py --include-metrics --output reports/diagnostics_ci.json --fail-on-status degraded
      - name: Upload quality summary
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: quality-reports
          path: reports/
