name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,helpers]'
      - name: Lint
        run: |
          python scripts/quality_gate.py format-check
          python scripts/quality_gate.py lint
      - name: Type check
        run: python scripts/quality_gate.py type
      - name: Legacy helper Phase 2A contracts
        run: |
          python scripts/quality_gate.py helper-surface
          python scripts/quality_gate.py helper-boundary
          python scripts/quality_gate.py helper-compatibility
      - name: Bandit
        run: python scripts/quality_gate.py bandit
      - name: Dependency audit
        run: python scripts/quality_gate.py audit
      - name: Binary scan
        run: python scripts/quality_gate.py binary
      - name: Run tests with coverage
        run: |
          python scripts/quality_gate.py tests
          python scripts/quality_gate.py coverage
      - name: Validate documentation links
        run: python scripts/quality_gate.py docs
      - name: Verify editable package installation
        run: python scripts/quality_gate.py editable-smoke
      - name: Build and smoke wheel
        run: python scripts/quality_gate.py wheel
      - name: Build and smoke zipapp
        run: python scripts/quality_gate.py zipapp
      - name: Capture diagnostics snapshot
        run: python scripts/quality_gate.py diagnostics
      - name: Upload quality summary
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: quality-reports
          path: reports/
