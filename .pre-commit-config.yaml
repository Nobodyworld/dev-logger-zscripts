repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
  - repo: local
    hooks:
      - id: format-check
        name: Ruff format check
        entry: python scripts/quality_gate.py format-check
        language: system
        pass_filenames: false
      - id: lint
        name: Ruff lint
        entry: python scripts/quality_gate.py lint
        language: system
        pass_filenames: false
      - id: type-check
        name: Supported mypy surface
        entry: python scripts/quality_gate.py type
        language: system
        pass_filenames: false
      - id: helper-surface
        name: Legacy helper surface freeze
        entry: python scripts/quality_gate.py helper-surface
        language: system
        pass_filenames: false
      - id: helper-boundary
        name: Maintained core helper-import boundary
        entry: python scripts/quality_gate.py helper-boundary
        language: system
        pass_filenames: false
      - id: helper-compatibility
        name: Legacy helper compatibility manifest
        entry: python scripts/quality_gate.py helper-compatibility
        language: system
        pass_filenames: false
      - id: bandit
        name: Bandit
        entry: python scripts/quality_gate.py bandit
        language: system
        pass_filenames: false
      - id: conventional-commit-message
        name: Conventional commit message
        entry: python scripts/validate_commit_message.py
        language: system
        stages: [commit-msg]
        pass_filenames: true
