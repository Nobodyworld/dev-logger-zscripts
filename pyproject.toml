[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zscripts"
version = "0.1.0"
description = "Zscripts is a structured log collection, normalization, redaction, diagnostics, and reporting toolkit for developers and automation systems."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "dev-logger-zscripts Maintainers" }]
keywords = ["logs", "etl", "ci", "observability", "tooling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Logging",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Nobodyworld/dev-logger-zscripts"
Repository = "https://github.com/Nobodyworld/dev-logger-zscripts"
Issues = "https://github.com/Nobodyworld/dev-logger-zscripts/issues"

[project.scripts]
zscripts = "zscripts.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "bandit>=1.7.10",
    "pip-audit>=2.7.3",
    "coverage[toml]>=7.6.0",
]
helpers = [
    "beautifulsoup4>=4.14.2",
    "img2pdf>=0.6.1",
    "lxml>=6.0.2",
    "matplotlib>=3.10.7",
    "nltk>=3.9.2",
    "numpy>=2.3.4",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pikepdf>=10.0.0",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
]
helpers-web = [
    "google-api-python-client>=2.186.0",
    "google-auth-oauthlib>=1.2.3",
    "google-auth>=2.42.1",
]
helpers-ml = [
    "scikit-learn>=1.7.2",
    "tiktoken>=0.12.0",
    "torch>=2.9.0",
]
helpers-optional = [
    "tensorflow>=2.20.0; python_version < '3.14'",
    "pygame>=2.6.1; python_version < '3.14'",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

